<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>TELEMETRÍA PISCINA // NEURAL CONTROL</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

:root{
    --bg:#05070d;
    --panel:rgba(255,255,255,0.03);
    --stroke:rgba(255,255,255,0.08);
    --cyan:#00e5ff;
    --pink:#ff2bd6;
    --green:#00ffb3;
    --text:#e8f0ff;
}

body{
    margin:0;
    font-family:Inter;
    background:
        radial-gradient(circle at 20% 10%, rgba(0,229,255,0.08), transparent 40%),
        radial-gradient(circle at 80% 20%, rgba(255,43,214,0.06), transparent 45%),
        radial-gradient(circle at top, #0b1020, var(--bg));
    color:var(--text);
}

/* HEADER */
.header{
    text-align:center;
    padding:22px;
}

.title{
    font-size:22px;
    font-weight:800;
    letter-spacing:4px;
}

.subtitle{
    font-size:11px;
    opacity:.6;
}

/* GRID */
.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(190px,1fr));
    gap:12px;
    padding:18px;
}

.card{
    background:linear-gradient(145deg, rgba(255,255,255,0.05), rgba(255,255,255,0.02));
    border:1px solid var(--stroke);
    border-radius:14px;
    padding:14px;
}

/* LABELS */
.label{
    font-size:11px;
    opacity:.7;
    text-transform:uppercase;
    letter-spacing:1px;
}

/* VALUES */
.value{
    font-size:26px;
    font-weight:700;
    margin-top:6px;
}

/* DOTS */
.dot{
    width:7px;
    height:7px;
    border-radius:2px;
    display:inline-block;
}
.cyan{ background:var(--cyan); box-shadow:0 0 8px var(--cyan); }
.pink{ background:var(--pink); box-shadow:0 0 8px var(--pink); }
.green{ background:var(--green); box-shadow:0 0 8px var(--green); }

/* LED */
.led{
    width:10px;
    height:10px;
    border-radius:50%;
    display:inline-block;
    margin-right:6px;
}

/* BOTONES */
.buttons{
    display:flex;
    justify-content:center;
    gap:8px;
    padding:10px;
}

button{
    background:rgba(255,255,255,0.03);
    border:1px solid var(--stroke);
    color:var(--text);
    padding:7px 11px;
    border-radius:10px;
}

/* CHART */
.chart-container{
    padding:10px 18px 25px;
}

canvas{
    background:rgba(255,255,255,0.02);
    border:1px solid var(--stroke);
    border-radius:14px;
    padding:10px;
}

</style>
</head>

<body>

<div class="header">
    <div class="title">TELEMETRÍA PISCINA // NEURAL CONTROL</div>
    <div class="subtitle" id="lastUpdate">--</div>
</div>

<div class="grid">

    <div class="card">
        <div class="label"><span class="dot cyan"></span> PISCINA</div>
        <div class="value" id="pool">--</div>
    </div>

    <div class="card">
        <div class="label"><span class="dot pink"></span> CALENTADOR</div>
        <div class="value" id="heater">--</div>
    </div>

    <div class="card">
        <div class="label"><span class="dot green"></span> Δ TEMPERATURA</div>
        <div class="value" id="delta">--</div>
    </div>

    <div class="card">
        <div class="label"><span class="led"></span> DEPURADORA</div>
        <div class="value" id="status">--</div>
    </div>

    <!-- ⏱ CICLO ACTUAL -->
    <div class="card">
        <div class="label"><span class="dot cyan"></span> TIEMPO CICLO</div>
        <div class="value" id="timeCycle">--</div>
    </div>

    <!-- ⏱ TOTAL DEPURACIÓN (M3) -->
    <div class="card">
        <div class="label"><span class="dot pink"></span> TIEMPO TOTAL DEPURACIÓN</div>
        <div class="value" id="timeTotal">--</div>
    </div>

    <!-- MÍNIMA -->
    <div class="card">
        <div class="label">
            <span class="dot cyan"></span>
            MÍNIMA REGISTRADA
        </div>
    
        <div style="margin-top:8px;font-size:13px;line-height:1.5">
            <div id="minDate">--</div>
            <div>Piscina: <span id="minPool">--</span></div>
            <div>Calentador: <span id="minHeater">--</span></div>
        </div>
    </div>

    <!-- MÁXIMA -->
    <div class="card">
        <div class="label">
            <span class="dot pink"></span>
            MÁXIMA REGISTRADA
        </div>
    
        <div style="margin-top:8px;font-size:13px;line-height:1.5">
            <div id="maxDate">--</div>
            <div>Piscina: <span id="maxPool">--</span></div>
            <div>Calentador: <span id="maxHeater">--</span></div>
        </div>
    </div>

    <div class="card">
        <div class="label"><span class="dot green"></span> ENERGÍA</div>
        <div class="value" id="energy">--</div>
    </div>

</div>

<div class="buttons">
    <button onclick="loadData('1h')">1H</button>
    <button onclick="loadData('3h')">3H</button>
    <button onclick="loadData('6h')">6H</button>
    <button onclick="loadData('24h')">24H</button>
    <button onclick="loadData('7d')">7D</button>
</div>

<div class="chart-container">
    <canvas id="chart"></canvas>
</div>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycbwjBTO4vlrXAvHzg7qZPdIRlmUb0TK4iNfUxHmPuDf9Apzni9HFccRBEJucO-ORuaDz/exec";

let chart;

async function loadData(periodo="3h") {

    const res = await fetch(`${API_URL}?periodo=${periodo}`);
    const data = await res.json();
    const r = data.resumen || {};

    // valores principales
    document.getElementById("pool").innerText = (r.temperaturaPiscina ?? "--") + " °C";
    document.getElementById("heater").innerText = (r.temperaturaCalentador ?? "--") + " °C";
    document.getElementById("delta").innerText = (Number(r.incrementoTemperatura ?? 0)).toFixed(2) + " °C";

    const on = (r.estado?.depuradora || "").includes("ON");
    document.getElementById("status").innerText = on ? "ACTIVE" : "OFFLINE";

    // ⏱ TIEMPO CICLO (I9)
    document.getElementById("timeCycle").innerText =
        r.estado?.tiempoTranscurrido ?? "--";

    // ⏱ TIEMPO TOTAL DEPURACIÓN (M3)
    document.getElementById("timeTotal").innerText =
        r.tiempoDepuracion ?? "--";

    // MÍNIMAS
    document.getElementById("minDate").innerText =
        r.minima?.fechaHora ?? "--";
    
    document.getElementById("minPool").innerText =
        (r.minima?.piscina ?? "--") + " °C";
    
    document.getElementById("minHeater").innerText =
        (r.minima?.calentador ?? "--") + " °C";
    
    // MÁXIMAS
    document.getElementById("maxDate").innerText =
        r.maxima?.fechaHora ?? "--";
    
    document.getElementById("maxPool").innerText =
        (r.maxima?.piscina ?? "--") + " °C";
    
    document.getElementById("maxHeater").innerText =
        (r.maxima?.calentador ?? "--") + " °C";

    document.getElementById("energy").innerText =
        r.balanceEnergetico ?? "--";

    document.getElementById("lastUpdate").innerText =
        "SYNC " + (r.fechaHora ?? "--");

    // gráfico
    const hist = data.historico || [];

    const labels = hist.map(x => new Date(x.fechaHora).toLocaleTimeString());
    const p = hist.map(x => x.piscina);
    const h = hist.map(x => x.calentador);

    if(chart) chart.destroy();

    chart = new Chart(document.getElementById("chart"), {
        type:"line",
        data:{
            labels,
            datasets:[
                {
                    label:"PISCINA",
                    data:p,
                    borderColor:"#00e5ff",
                    borderWidth:2,
                    tension:0.35,
                    pointRadius:0
                },
                {
                    label:"CALENTADOR",
                    data:h,
                    borderColor:"#ff2bd6",
                    borderWidth:2,
                    tension:0.35,
                    pointRadius:0
                }
            ]
        }
    });

}

loadData("3h");
setInterval(()=>loadData("3h"),60000);

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>POOL // CONTROL NODE</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

:root {
    --bg:#05070d;
    --panel:rgba(255,255,255,0.04);
    --stroke:rgba(255,255,255,0.08);
    --cyan:#00e5ff;
    --pink:#ff2bd6;
    --green:#00ffb3;
    --red:#ff3b3b;
    --text:#e8f0ff;
}

body{
    margin:0;
    font-family:Inter;
    background: radial-gradient(circle at top, #0a1020, var(--bg));
    color:var(--text);
}

/* HEADER */
.header{
    text-align:center;
    padding:20px;
    border-bottom:1px solid var(--stroke);
}

.title{
    font-size:20px;
    font-weight:800;
    letter-spacing:3px;
}

.subtitle{
    font-size:11px;
    opacity:.6;
}

/* GRID */
.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
    gap:12px;
    padding:18px;
}

.card{
    background:var(--panel);
    border:1px solid var(--stroke);
    border-radius:14px;
    padding:14px;
    position:relative;
    overflow:hidden;
    transition:.3s;
}

.card:hover{
    transform:translateY(-2px);
    border-color:rgba(0,229,255,0.3);
}

/* glow effect */
.card::before{
    content:"";
    position:absolute;
    inset:0;
    background:radial-gradient(circle at top left, rgba(0,229,255,0.08), transparent 60%);
    pointer-events:none;
}

.label{
    font-size:11px;
    opacity:.7;
    display:flex;
    align-items:center;
    gap:6px;
}

.value{
    font-size:24px;
    font-weight:700;
    margin-top:6px;
}

/* ICONOS (simples, sin librerías) */
.ico{
    width:8px;
    height:8px;
    border-radius:2px;
    display:inline-block;
}

.cyan{ background:var(--cyan); }
.pink{ background:var(--pink); }
.green{ background:var(--green); }
.red{ background:var(--red); }

/* STATUS LED */
.led{
    width:10px;
    height:10px;
    border-radius:50%;
    display:inline-block;
    margin-right:6px;
    box-shadow:0 0 10px currentColor;
}

/* BUTTONS */
.buttons{
    display:flex;
    justify-content:center;
    gap:8px;
    padding:10px;
}

button{
    background:var(--panel);
    border:1px solid var(--stroke);
    color:var(--text);
    padding:6px 10px;
    border-radius:10px;
    cursor:pointer;
    font-size:12px;
    transition:.2s;
}

button:hover{
    border-color:var(--cyan);
    box-shadow:0 0 10px rgba(0,229,255,0.2);
}

/* CHART */
.chart-container{
    padding:10px 18px 25px;
}

canvas{
    background:rgba(255,255,255,0.02);
    border:1px solid var(--stroke);
    border-radius:14px;
    padding:10px;
}

</style>
</head>

<body>

<div class="header">
    <div class="title">POOL // CONTROL NODE</div>
    <div class="subtitle" id="lastUpdate">--</div>
</div>

<div class="grid">

    <div class="card">
        <div class="label"><span class="ico cyan"></span>Piscina</div>
        <div class="value" id="pool">--</div>
    </div>

    <div class="card">
        <div class="label"><span class="ico pink"></span>Calentador</div>
        <div class="value" id="heater">--</div>
    </div>

    <div class="card">
        <div class="label"><span class="ico green"></span>Delta térmico</div>
        <div class="value" id="delta">--</div>
    </div>

    <div class="card">
        <div class="label"><span id="led" class="led"></span>Depuradora</div>
        <div class="value" id="status">--</div>
    </div>

    <div class="card">
        <div class="label"><span class="ico cyan"></span>Tiempo depuración</div>
        <div class="value" id="time">--</div>
    </div>

    <div class="card">
        <div class="label"><span class="ico pink"></span>Energía</div>
        <div class="value" id="energy">--</div>
    </div>

</div>

<div class="buttons">
    <button onclick="loadData('1h')">1H</button>
    <button onclick="loadData('3h')">3H</button>
    <button onclick="loadData('6h')">6H</button>
    <button onclick="loadData('24h')">24H</button>
    <button onclick="loadData('7d')">7D</button>
</div>

<div class="chart-container">
    <canvas id="chart"></canvas>
</div>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycbwjBTO4vlrXAvHzg7qZPdIRlmUb0TK4iNfUxHmPuDf9Apzni9HFccRBEJucO-ORuaDz/exec";

let chart;

async function loadData(periodo="3h") {

    try {

        const res = await fetch(`${API_URL}?periodo=${periodo}`);
        const data = await res.json();
        const r = data.resumen || {};

        document.getElementById("pool").innerText = (r.temperaturaPiscina ?? "--") + " °C";
        document.getElementById("heater").innerText = (r.temperaturaCalentador ?? "--") + " °C";
        document.getElementById("delta").innerText = (Number(r.incrementoTemperatura ?? 0)).toFixed(2) + " °C";

        const on = (r.estado?.depuradora || "").includes("ON");

        document.getElementById("status").innerText = on ? "ON" : "OFF";

        document.getElementById("led").style.color = on ? "#00ffb3" : "#ff3b3b";

        document.getElementById("time").innerText = r.estado?.tiempoTranscurrido ?? "--";
        document.getElementById("energy").innerText = r.balanceEnergetico ?? "--";

        document.getElementById("lastUpdate").innerText =
            "SYNC: " + (r.fechaHora ?? "--");

        const hist = data.historico || [];

        const labels = hist.map(x => new Date(x.fechaHora).toLocaleTimeString());
        const p = hist.map(x => x.piscina);
        const h = hist.map(x => x.calentador);

        if(chart) chart.destroy();

        chart = new Chart(document.getElementById("chart"), {
            type:"line",
            data:{
                labels,
                datasets:[
                    {
                        label:"Piscina",
                        data:p,
                        borderColor:"#00e5ff",
                        borderWidth:2,
                        tension:0.35,
                        pointRadius:0
                    },
                    {
                        label:"Calentador",
                        data:h,
                        borderColor:"#ff2bd6",
                        borderWidth:2,
                        tension:0.35,
                        pointRadius:0
                    }
                ]
            },
            options:{
                responsive:true,
                plugins:{
                    legend:{ labels:{ color:"#fff" } }
                },
                scales:{
                    x:{ ticks:{ color:"#aaa" }, grid:{ color:"rgba(255,255,255,0.05)" } },
                    y:{ ticks:{ color:"#aaa" }, grid:{ color:"rgba(255,255,255,0.05)" } }
                }
            }
        });

    } catch(e){
        console.error(e);
    }
}

loadData("3h");
setInterval(()=>loadData("3h"),60000);

</script>

</body>
</html>

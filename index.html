<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>TELEMETRÍA PISCINA // NEURAL CONTROL</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

:root{
    --bg:#05070d;
    --panel:rgba(255,255,255,0.03);
    --stroke:rgba(255,255,255,0.08);
    --cyan:#00e5ff;
    --pink:#ff2bd6;
    --green:#00ffb3;
    --text:#e8f0ff;
}

body{
    margin:0;
    font-family:Inter;
    background:
        radial-gradient(circle at 20% 10%, rgba(0,229,255,0.08), transparent 40%),
        radial-gradient(circle at 80% 20%, rgba(255,43,214,0.06), transparent 45%),
        radial-gradient(circle at top, #0b1020, var(--bg));
    color:var(--text);
}

/* HEADER FUTURISTA */
.header{
    text-align:center;
    padding:22px;
    position:relative;
}

.header::after{
    content:"";
    position:absolute;
    bottom:0;
    left:50%;
    transform:translateX(-50%);
    width:60%;
    height:1px;
    background:linear-gradient(90deg, transparent, var(--cyan), transparent);
    opacity:.6;
}

.title{
    font-size:22px;
    font-weight:800;
    letter-spacing:4px;
    text-shadow:0 0 20px rgba(0,229,255,0.3);
}

.subtitle{
    font-size:11px;
    opacity:.6;
}

/* GRID MÁS “3D” */
.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(190px,1fr));
    gap:12px;
    padding:18px;
}

.card{
    background:linear-gradient(145deg, rgba(255,255,255,0.05), rgba(255,255,255,0.02));
    border:1px solid var(--stroke);
    border-radius:14px;
    padding:14px;
    position:relative;
    overflow:hidden;
    transition:.25s;
    backdrop-filter: blur(8px);
}

.card:hover{
    transform:translateY(-3px);
    border-color:rgba(0,229,255,0.4);
    box-shadow:0 0 25px rgba(0,229,255,0.08);
}

/* glow dinámico */
.card::before{
    content:"";
    position:absolute;
    inset:-2px;
    background:radial-gradient(circle at top left, rgba(0,229,255,0.12), transparent 60%);
    opacity:.5;
}

.label{
    font-size:11px;
    opacity:.7;
    display:flex;
    align-items:center;
    gap:6px;
    text-transform:uppercase;
    letter-spacing:1px;
}

.value{
    font-size:26px;
    font-weight:700;
    margin-top:6px;
}

/* ICONOS MINI FUTURISTAS */
.dot{
    width:7px;
    height:7px;
    border-radius:2px;
    display:inline-block;
}

.cyan{ background:var(--cyan); box-shadow:0 0 8px var(--cyan); }
.pink{ background:var(--pink); box-shadow:0 0 8px var(--pink); }
.green{ background:var(--green); box-shadow:0 0 8px var(--green); }

/* STATUS LED REAL */
.led{
    width:10px;
    height:10px;
    border-radius:50%;
    margin-right:6px;
    display:inline-block;
    box-shadow:0 0 12px currentColor;
}

/* BOTONES MÁS TECH */
.buttons{
    display:flex;
    justify-content:center;
    gap:8px;
    padding:10px;
}

button{
    background:rgba(255,255,255,0.03);
    border:1px solid var(--stroke);
    color:var(--text);
    padding:7px 11px;
    border-radius:10px;
    cursor:pointer;
    font-size:12px;
    transition:.2s;
}

button:hover{
    border-color:var(--cyan);
    box-shadow:0 0 12px rgba(0,229,255,0.2);
    transform:translateY(-1px);
}

/* CHART estilo terminal */
.chart-container{
    padding:10px 18px 25px;
}

canvas{
    background:rgba(255,255,255,0.02);
    border:1px solid var(--stroke);
    border-radius:14px;
    padding:10px;
}

</style>
</head>

<body>

<div class="header">
    <div class="title">TELEMETRÍA PISCINA // NEURAL CONTROL</div>
    <div class="subtitle" id="lastUpdate">--</div>
</div>

<div class="grid">

    <div class="card">
        <div class="label"><span class="dot cyan"></span> PISCINA</div>
        <div class="value" id="pool">--</div>
    </div>

    <div class="card">
        <div class="label"><span class="dot pink"></span> CALENTADOR</div>
        <div class="value" id="heater">--</div>
    </div>

    <div class="card">
        <div class="label"><span class="dot green"></span> Δ TEMPERATURA</div>
        <div class="value" id="delta">--</div>
    </div>

    <div class="card">
        <div class="label"><span id="led" class="led"></span> DEPURADORA</div>
        <div class="value" id="status">--</div>
    </div>

    <div class="card">
        <div class="label"><span class="dot cyan"></span> TIEMPO CICLO</div>
        <div class="value" id="time">--</div>
    </div>

    <div class="card">
        <div class="label"><span class="dot pink"></span> ENERGÍA</div>
        <div class="value" id="energy">--</div>
    </div>

</div>

<div class="buttons">
    <button onclick="loadData('1h')">1H</button>
    <button onclick="loadData('3h')">3H</button>
    <button onclick="loadData('6h')">6H</button>
    <button onclick="loadData('24h')">24H</button>
    <button onclick="loadData('7d')">7D</button>
</div>

<div class="chart-container">
    <canvas id="chart"></canvas>
</div>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycbwjBTO4vlrXAvHzg7qZPdIRlmUb0TK4iNfUxHmPuDf9Apzni9HFccRBEJucO-ORuaDz/exec";

let chart;

async function loadData(periodo="3h") {

    const res = await fetch(`${API_URL}?periodo=${periodo}`);
    const data = await res.json();
    const r = data.resumen || {};

    document.getElementById("pool").innerText = (r.temperaturaPiscina ?? "--") + " °C";
    document.getElementById("heater").innerText = (r.temperaturaCalentador ?? "--") + " °C";
    document.getElementById("delta").innerText = (Number(r.incrementoTemperatura ?? 0)).toFixed(2) + " °C";

    const on = (r.estado?.depuradora || "").includes("ON");

    document.getElementById("status").innerText = on ? "ACTIVE" : "OFFLINE";
    document.getElementById("led").style.color = on ? "#00ffb3" : "#ff3b3b";

    document.getElementById("time").innerText = r.estado?.tiempoTranscurrido ?? "--";
    document.getElementById("energy").innerText = r.balanceEnergetico ?? "--";

    document.getElementById("lastUpdate").innerText = "SYNC " + (r.fechaHora ?? "--");

    const hist = data.historico || [];

    const labels = hist.map(x => new Date(x.fechaHora).toLocaleTimeString());
    const p = hist.map(x => x.piscina);
    const h = hist.map(x => x.calentador);

    if(chart) chart.destroy();

    chart = new Chart(document.getElementById("chart"), {
        type:"line",
        data:{
            labels,
            datasets:[
                {
                    label:"PISCINA",
                    data:p,
                    borderColor:"#00e5ff",
                    borderWidth:2,
                    tension:0.35,
                    pointRadius:0
                },
                {
                    label:"CALENTADOR",
                    data:h,
                    borderColor:"#ff2bd6",
                    borderWidth:2,
                    tension:0.35,
                    pointRadius:0
                }
            ]
        },
        options:{
            responsive:true,
            plugins:{
                legend:{ labels:{ color:"#fff" } }
            },
            scales:{
                x:{ ticks:{ color:"#aaa" }, grid:{ color:"rgba(255,255,255,0.04)" } },
                y:{ ticks:{ color:"#aaa" }, grid:{ color:"rgba(255,255,255,0.04)" } }
            }
        }
    });
}

loadData("3h");
setInterval(()=>loadData("3h"),60000);

</script>

</body>
</html>

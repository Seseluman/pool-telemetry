<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Pool Telemetry Center</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

/* =========================
   BACKGROUND FUTURISTA
========================= */
body {
    margin: 0;
    font-family: 'Inter', sans-serif;
    color: #e8f0ff;
    background:
        radial-gradient(circle at 20% 20%, #0f2a3a 0%, transparent 40%),
        radial-gradient(circle at 80% 30%, #1b1440 0%, transparent 45%),
        radial-gradient(circle at 50% 80%, #002b2b 0%, transparent 50%),
        #05070d;
    overflow-x: hidden;
}

/* HEADER */
.header {
    padding: 20px;
    text-align: center;
    border-bottom: 1px solid rgba(255,255,255,0.08);
}

.title {
    font-size: 20px;
    font-weight: 800;
    letter-spacing: 3px;
    color: #00ffd5;
    text-shadow: 0 0 10px rgba(0,255,213,0.3);
}

.subtitle {
    font-size: 12px;
    opacity: 0.7;
    letter-spacing: 1px;
}

/* GRID */
.grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 15px;
    padding: 20px;
}

/* CARD */
.card {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(0, 255, 200, 0.15);
    border-radius: 18px;
    padding: 16px;
    backdrop-filter: blur(14px);
    box-shadow:
        0 0 20px rgba(0,255,200,0.08),
        inset 0 0 12px rgba(255,255,255,0.03);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
}

.card:hover {
    transform: translateY(-3px);
    box-shadow:
        0 0 25px rgba(0,255,200,0.18),
        inset 0 0 12px rgba(255,255,255,0.05);
}

.label {
    font-size: 11px;
    opacity: 0.6;
}

.value {
    font-size: 26px;
    font-weight: 700;
    margin-top: 5px;
}

/* LED */
.led {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    display: inline-block;
    margin-right: 8px;
}

/* BUTTONS */
.buttons {
    display: flex;
    gap: 10px;
    justify-content: center;
    padding: 10px 0;
}

button {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    color: white;
    padding: 8px 12px;
    border-radius: 10px;
    cursor: pointer;
    transition: 0.2s;
}

button:hover {
    background: rgba(0,255,179,0.1);
}

/* CHART */
.chart-container {
    padding: 20px;
}

</style>

</head>

<body>

<div class="header">
    <div class="title">POOL TELEMETRY CENTER</div>
    <div class="subtitle" id="lastUpdate">--</div>
</div>

<div class="grid">

    <div class="card">
        <div class="label">Piscina</div>
        <div class="value" id="pool">--</div>
    </div>

    <div class="card">
        <div class="label">Calentador</div>
        <div class="value" id="heater">--</div>
    </div>

    <div class="card">
        <div class="label">ΔT</div>
        <div class="value" id="delta">--</div>
    </div>

    <div class="card">
        <div class="label">Depuradora</div>
        <div class="value" id="status">--</div>
    </div>

    <div class="card">
        <div class="label">Tiempo depuración</div>
        <div class="value" id="time">--</div>
    </div>

    <div class="card">
        <div class="label">Balance energético</div>
        <div class="value" id="energy">--</div>
    </div>

</div>

<div class="buttons">
    <button onclick="loadData('1h')">1H</button>
    <button onclick="loadData('3h')">3H</button>
    <button onclick="loadData('6h')">6H</button>
    <button onclick="loadData('24h')">24H</button>
    <button onclick="loadData('7d')">7D</button>
</div>

<div class="chart-container">
    <canvas id="chart"></canvas>
</div>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycbwjBTO4vlrXAvHzg7qZPdIRlmUb0TK4iNfUxHmPuDf9Apzni9HFccRBEJucO-ORuaDz/exec";

let chart;

/* =========================
   COLOR SEGÚN TEMPERATURA
========================= */
function tempColor(value) {
    if (value < 26) return "#00d4ff";
    if (value < 30) return "#00ffb3";
    if (value < 33) return "#ffcc00";
    return "#ff4d4d";
}

/* =========================
   LOAD DATA
========================= */
async function loadData(periodo = "3h") {

    const res = await fetch(
        "https://api.allorigins.win/raw?url=" +
        encodeURIComponent(`${API_URL}?periodo=${periodo}`)
    );

    const data = await res.json();
    const r = data.resumen;

    // TEMPERATURAS
    const pool = document.getElementById("pool");
    pool.innerText = r.temperaturaPiscina + " °C";
    pool.style.color = tempColor(r.temperaturaPiscina);

    const heater = document.getElementById("heater");
    heater.innerText = r.temperaturaCalentador + " °C";
    heater.style.color = tempColor(r.temperaturaCalentador);

    document.getElementById("delta").innerText =
        r.incrementoTemperatura.toFixed(2) + " °C";

    // LED DEPURADORA
    const status = document.getElementById("status");
    const isOn = r.estado.depuradora.includes("ON");

    status.innerHTML = isOn
        ? '<span class="led" style="background:#00ffb3; box-shadow:0 0 10px #00ffb3"></span> ACTIVA'
        : '<span class="led" style="background:#ff4d4d; box-shadow:0 0 10px #ff4d4d"></span> INACTIVA';

    document.getElementById("time").innerText = r.estado.tiempoTranscurrido;
    document.getElementById("energy").innerText = r.balanceEnergetico;

    document.getElementById("lastUpdate").innerText =
        "Última actualización: " + r.fechaHora;

    /* =========================
       GRÁFICA
    ========================= */
    const labels = data.historico.map(x =>
        new Date(x.fechaHora).toLocaleTimeString()
    );

    const poolData = data.historico.map(x => x.piscina);
    const heaterData = data.historico.map(x => x.calentador);

    if (chart) chart.destroy();

    const ctx = document.getElementById("chart");

    chart = new Chart(ctx, {
        type: 'line',
        data: {
            labels: labels,
            datasets: [
                {
                    label: "Piscina",
                    data: poolData,
                    borderColor: "#00d4ff",
                    tension: 0.3
                },
                {
                    label: "Calentador",
                    data: heaterData,
                    borderColor: "#ff00aa",
                    tension: 0.3
                }
            ]
        },
        options: {
            responsive: true,
            plugins: {
                legend: {
                    labels: { color: "#00ffd5" }
                }
            },
            scales: {
                x: { ticks: { color: "#aaa" } },
                y: { ticks: { color: "#aaa" } }
            }
        }
    });
}

/* AUTO REFRESH */
loadData("3h");
setInterval(() => loadData("3h"), 60000);

</script>

</body>
</html>
